name: Publicação da interface (GitHub Pages)
# Fase 2, operação F2-9 (Docs/implantacao/ROTEIRO_FASE2.md): só com "AUTORIZO F2-9" e as providências P-6 e P-7, depois de
# a variável do repositório VITE_API_BASE_URL apontar para o serviço no Cloud Run. O envio de uma etiqueta publicacao-pages-*
# aciona: a conferência da proteção (sem ambiente), o build (sem ambiente) e a publicação no ambiente github-pages, que
# espera a aprovação do responsável. A interface fica em https://gustavohoff1987.github.io/Teste-Agente/.
on:
  push:
    tags: ["publicacao-pages-*"]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  conferir-protecao:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - name: Ambiente github-pages, revisor, etiquetas e o commit no ramo de preparação (só leitura)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/conferir_protecao.py --ambiente github-pages
          --etiquetas "publicacao-pages-*" --ramo implantacao/cloud-run-pages

  build:
    needs: conferir-protecao
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: "22.23.4"
      - name: Endereço do serviço (variável do repositório, não é segredo)
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if ! printf '%s' "$VITE_API_BASE_URL" | grep -Eq '^https://[a-z0-9.-]+\.run\.app$'; then
            echo "::error title=VITE_API_BASE_URL::defina a variável do repositório com o endereço do Cloud Run (https://….run.app, sem / no fim)"
            exit 1
          fi
      - name: Dependências, testes, TypeScript e build com o caminho do Pages
        working-directory: frontend
        env:
          ADT_BASE_DA_PAGINA: /Teste-Agente/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          npm ci
          npm run build
      - name: Padrão de chave do Google no build
        run: python3 .github/scripts/verificar_chave_google.py frontend/dist
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: frontend/dist

  publicar:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
