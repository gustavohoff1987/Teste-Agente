name: CI Portal Experimental
on:
  push:
    branches: [main, feat/portal-uma-pagina-v1]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements-test.txt
      - run: cd backend && python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  ui-conversational:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r backend/requirements-ui.txt
      - run: npm install
        working-directory: frontend
      - name: Start local services and run conversational browser regression
        run: |
          (cd backend && uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/adt-backend.log 2>&1) &
          (cd frontend && npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/adt-frontend.log 2>&1) &
          python - <<'PY'
          import time
          import urllib.request
          for url in ["http://127.0.0.1:8000/api/health", "http://127.0.0.1:5173"]:
              for _ in range(50):
                  try:
                      with urllib.request.urlopen(url, timeout=2) as response:
                          if response.status == 200:
                              break
                  except Exception:
                      time.sleep(0.3)
              else:
                  raise SystemExit("Local service did not start: " + url)
          PY
          cd backend && ADT_BROWSER_CHANNEL=chrome python tests/ui_conversational_smoke.py
