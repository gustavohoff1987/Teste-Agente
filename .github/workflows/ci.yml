name: CI Portal Experimental
on:
  push:
    branches: [main, feat/portal-uma-pagina-v1, feat/novos-blocos-incrementais]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements-test.txt
      - run: cd backend && python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  ui-conversational:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r backend/requirements-ui.txt
      - run: npm install
        working-directory: frontend
      - name: Install synthetic dual-source Brazilian catalog
        run: python backend/tests/prepare_ui_brazil_catalog.py
      - name: Start local services and run conversational browser regression
        run: |
          (cd backend && ADT_BRASIL_DATA_DIR=/tmp/adt-brazil-synthetic uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/adt-backend.log 2>&1) &
          (cd frontend && npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/adt-frontend.log 2>&1) &
          python - <<'PY'
          import time
          import urllib.request
          for url in ["http://127.0.0.1:8000/api/health", "http://127.0.0.1:5173"]:
              for _ in range(50):
                  try:
                      with urllib.request.urlopen(url, timeout=2) as response:
                          if response.status == 200:
                              break
                  except Exception:
                      time.sleep(0.3)
              else:
                  raise SystemExit("Local service did not start: " + url)
          PY
          cd backend && ADT_BROWSER_CHANNEL=chrome python tests/ui_conversational_smoke.py

  ui-block1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r backend/requirements-ui.txt
      - run: python -m playwright install --with-deps chrome
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python backend/tests/prepare_block1_catalog.py /tmp/adt-block1
      - name: Validate selection, history and exploration without Gemini
        run: |
          ADT_BRASIL_DATA_DIR=/tmp/adt-block1 python backend/tests/serve_ui_offline.py > /tmp/adt-block1.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for _ in range(50):
              try:
                  urllib.request.urlopen('http://127.0.0.1:18000/api/health', timeout=2)
                  break
              except OSError:
                  time.sleep(.3)
          else:
              raise SystemExit('Servidor não iniciou')
          PY
          ADT_UI_URL=http://127.0.0.1:18000/ python backend/tests/ui_block1_smoke.py
          ADT_UI_URL=http://127.0.0.1:18000/ python backend/tests/ui_block1_regression.py
      - name: Validate interpretation through a simulated Gemini transport (no provider calls)
        run: |
          # Processo novo: o servidor bloqueia rede externa e substitui apenas o transporte Gemini.
          ADT_BRASIL_DATA_DIR=/tmp/adt-block1 ADT_FAKE_GEMINI_LOG=/tmp/adt-fake-gemini.jsonl \
            python backend/tests/serve_ui_fake_gemini.py > /tmp/adt-fake-gemini.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for _ in range(50):
              try:
                  urllib.request.urlopen('http://127.0.0.1:18200/api/health', timeout=2)
                  break
              except OSError:
                  time.sleep(.3)
          else:
              raise SystemExit('Servidor não iniciou')
          PY
          ADT_UI_URL=http://127.0.0.1:18200/ ADT_FAKE_GEMINI_LOG=/tmp/adt-fake-gemini.jsonl python backend/tests/ui_block1_integration.py
      - name: Server logs
        if: failure()
        run: tail -n 80 /tmp/adt-block1.log /tmp/adt-fake-gemini.log || true
