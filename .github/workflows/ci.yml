name: CI Portal Experimental
on:
  push:
    # feat/desafio-adversarial-conversacional: ramo principal de desenvolvimento desde 26/10/2026, sem pull request
    # (decisão do responsável); o CI precisa rodar no push dele. implantacao/cloud-run-pages: o ramo de preparação da
    # implantação (Cloud Run + GitHub Pages, 01/11/2026), também sem merge nem pull request.
    branches: [main, feat/portal-uma-pagina-v1, feat/novos-blocos-incrementais, feat/desafio-adversarial-conversacional,
               implantacao/cloud-run-pages]
  pull_request:

# Um push novo no mesmo ramo cancela a execução anterior. Assim, commits intermediários não
# deixam falhas que ninguém vai ler, e o resultado exibido é sempre o do estado mais recente.
# Nenhuma verificação se perde: a governança confere todos os commits desde a vigência da regra.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash  # bash -eo pipefail: a falha de qualquer comando de um pipe falha o passo

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements-test.txt
      - run: cd backend && python -m pytest -q -rs

  dados-reais:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements-test.txt
      - name: Integridade da base Brasil versionada (tamanho e SHA-256 conferidos com o manifesto)
        run: |
          python backend/brazil_data.py diagnostico | tee "$RUNNER_TEMP/integridade.json"
          python - "$RUNNER_TEMP/integridade.json" <<'PY'
          import json, sys
          estado = json.load(open(sys.argv[1], encoding="utf-8"))
          if estado.get("modo") != "repositorio" or estado.get("integridade") != "verificada":
              print("::error title=Base Brasil versionada::integridade não verificada: " + str(estado.get("motivo")))
              sys.exit(1)
          PY
      - name: Suíte completa com os dados reais (nenhum teste pode ser pulado)
        env:
          ADT_REAL_DATA_DIR: ${{ github.workspace }}
        run: |
          cd backend
          python -m pytest -q -rs | tee "$RUNNER_TEMP/pytest-dados-reais.log"
          if grep -qE "[0-9]+ skipped" "$RUNNER_TEMP/pytest-dados-reais.log"; then
            echo "::error title=Testes pulados::Com a base versionada nenhum teste pode ser pulado; veja as linhas SKIPPED acima."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # As jornadas de navegador rodam pelo executor único (backend/tests/run_ui_checks.py), o mesmo
  # comando usado na máquina local. Cada roteiro roda isolado: uma falha não esconde as seguintes,
  # e o resumo da execução lista o resultado de cada um.
  ui-conversational:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: pip install -r backend/requirements-ui.txt
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Jornada conversacional (catálogo sintético, sem Gemini)
        env:
          ADT_BROWSER_CHANNEL: chrome
        run: python backend/tests/run_ui_checks.py --suite conversa

  ui-block1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: pip install -r backend/requirements-ui.txt
      - run: python -m playwright install --with-deps chrome
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Blocos 1 a 3, Gemini simulado e jornada com a base Brasil versionada
        env:
          ADT_BROWSER_CHANNEL: chrome
        run: python backend/tests/run_ui_checks.py --suite bloco1 --suite gemini-simulado --suite base-versionada

  governanca:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # a regra confere todos os commits desde a vigência
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Mudanças de comportamento registradas e jornadas de navegador no CI
        run: python .github/scripts/verificar_governanca.py

  # Hospedagem (01/11/2026; Docs/implantacao/): a imagem do contêiner nas condições do Cloud Run (1 CPU, 2 GiB sem swap e
  # /tmp em memória), construída aqui e nunca enviada a registro, e a interface como no GitHub Pages (/Teste-Agente/ e, desde
  # 04/11/2026, também na raiz, como em https://diagnostico-territorial.github.io/; com o
  # serviço noutro endereço). Confere a sintaxe dos workflows e o padrão de chave do Google na imagem, no build e nos
  # artefatos; mede partida, memória, análises, planilhas, sessões, Gemini simulado e concorrência (artefato
  # "medicoes-do-conteiner"); roda pelo navegador a hospedagem simulada e a sessão temporária. A CPU do runner não é a vCPU
  # do Google: nada daqui é confirmação na nuvem.
  conteiner:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      ADT_CONTEINER_IMAGEM: adt:ci
      ADT_CONTEINER_NOME: adt-api-ui
      ADT_CONTEINER_PORTA: "18080"
      ADT_PAGES_DIST: ${{ github.workspace }}/frontend/dist-pages
      ADT_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v5
      - name: Sintaxe dos workflows (actionlint)
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color -shellcheck= -pyflakes=
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Dependências fixadas da imagem (as mesmas da referência no runner) e o navegador dos roteiros
        run: |
          pip install --no-deps -r backend/requirements-conteiner.txt
          pip check
          pip install "playwright>=1.50,<2"
      - name: Imagem do contêiner (sem envio a registro)
        run: docker build --pull -t "$ADT_CONTEINER_IMAGEM" .
      - name: Interface no build de sempre e como no GitHub Pages (/Teste-Agente/ e /, serviço noutro endereço)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          ADT_BASE_DA_PAGINA=/Teste-Agente/ VITE_API_BASE_URL=http://127.0.0.1:18080 npx --no-install vite build --outDir dist-pages
          ADT_BASE_DA_PAGINA=/ VITE_API_BASE_URL=http://127.0.0.1:18080 npx --no-install vite build --outDir dist-raiz
      - name: Padrão de chave do Google na imagem e nos builds da interface
        run: |
          python .github/scripts/verificar_chave_google.py frontend/dist frontend/dist-pages frontend/dist-raiz
          docker run --rm --entrypoint python -v "$PWD/.github/scripts:/verificacao:ro" "$ADT_CONTEINER_IMAGEM" \
            /verificacao/verificar_chave_google.py --raiz-da-imagem /
      - name: Medições nas condições do Cloud Run (partida, memória, análises, planilhas, sessões, Gemini simulado e concorrência)
        run: python .github/scripts/medir_conteiner.py --imagem "$ADT_CONTEINER_IMAGEM" --saida "$RUNNER_TEMP/medicoes"
      - name: Navegador - hospedagem simulada (contêiner e Pages) e a sessão temporária
        if: ${{ !cancelled() }}
        run: python backend/tests/run_ui_checks.py --suite conteiner --suite conteiner-raiz --suite sessao
      - name: Padrão de chave do Google nos artefatos
        if: ${{ !cancelled() }}
        run: python .github/scripts/verificar_chave_google.py "$RUNNER_TEMP/medicoes" .local/ui-validation
      - name: Medições (artefato)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: medicoes-do-conteiner
          path: ${{ runner.temp }}/medicoes
          retention-days: 30

  # Quadro único com o resultado de cada verificação. Falha se qualquer uma falhar, de modo que
  # basta exigir "resumo" na proteção do ramo para exigir todas.
  resumo:
    if: ${{ !cancelled() }}
    needs: [backend, dados-reais, frontend, ui-conversational, ui-block1, governanca, conteiner]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Quadro de resultados
        env:
          RESULTADOS: ${{ toJSON(needs) }}
          COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          nomes = {
              "backend": "Backend (pytest)",
              "dados-reais": "Base Brasil versionada: integridade e testes com dados reais",
              "frontend": "Frontend: TypeScript e build",
              "ui-conversational": "Navegador: jornada conversacional",
              "ui-block1": "Navegador: Blocos 1 a 3, Gemini simulado e base versionada",
              "governanca": "Governança: registro de comportamento e jornadas no CI",
              "conteiner": "Contêiner nas condições do Cloud Run e hospedagem simulada (Pages)",
          }
          rotulo = {"success": "✅ passou", "failure": "❌ falhou", "cancelled": "⏹️ cancelado", "skipped": "⏭️ não executado"}
          resultados = json.loads(os.environ["RESULTADOS"])
          linhas = ["| Verificação | Resultado |", "|---|---|"]
          problemas = []
          for job, nome in nomes.items():
              estado = resultados.get(job, {}).get("result", "ausente")
              linhas.append(f"| {nome} | {rotulo.get(estado, estado)} |")
              if estado != "success":
                  problemas.append(nome)
                  print(f"::error title=Verificação sem sucesso::{nome}: {estado}")
          texto = (f"### Resumo do CI · commit {os.environ['COMMIT'][:7]}\n\n" + "\n".join(linhas) + "\n\n" +
                   (f"**{len(problemas)} verificação(ões) sem sucesso.** Corrija antes de seguir com novas mudanças."
                    if problemas else "**Todas as verificações passaram.**") + "\n")
          print(texto)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(texto)
          sys.exit(1 if problemas else 0)
          PY
